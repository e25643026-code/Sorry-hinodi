
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry Hino ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #080812;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  overflow-x: hidden;
  background: linear-gradient(180deg, #080812, #19102c, #32112c);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

#scene {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  overflow: hidden;
  isolation: isolate;
  padding: 35px 14px 45px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: filter 1s ease;
}

#scene::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(ellipse at 50% 65%,
      rgba(255, 35, 100, .17), transparent 48%),
    linear-gradient(180deg, #090817, #21112f 60%, #100b20);
}

h1 {
  font-size: clamp(27px, 7vw, 43px);
  line-height: 1.3;
  color: #ff8cb8;
  text-shadow: 0 0 15px #ff287b;
  margin-bottom: 16px;
  animation: titleGlow 2s infinite alternate;
}

.subtitle {
  font-size: 16px;
  color: #ffd8e7;
  margin-bottom: 20px;
}

#heartArea {
  position: relative;
  width: 180px;
  height: 180px;
  display: grid;
  place-items: center;
  margin: 8px auto 20px;
}

.heart {
  font-size: 100px;
  line-height: 1;
  color: #ff003c;
  filter: drop-shadow(0 0 12px #ff003c);
  animation: hardBeat .72s infinite;
  transform-origin: center;
}

.heart::selection {
  background: transparent;
}

.heart-ring {
  position: absolute;
  inset: 10px;
  border: 2px solid rgba(255, 30, 85, .7);
  border-radius: 50%;
  animation: ringPulse 1.4s infinite;
}

.heart-ring:nth-child(2) {
  animation-delay: .45s;
}

@keyframes hardBeat {
  0%, 100% {
    transform: scale(1);
    filter: drop-shadow(0 0 12px #ff003c);
  }
  12% {
    transform: scale(1.22);
    filter: drop-shadow(0 0 28px #ff003c);
  }
  24% {
    transform: scale(1.02);
  }
  38% {
    transform: scale(1.3);
    filter: drop-shadow(0 0 38px #ff174d);
  }
  55% {
    transform: scale(.98);
  }
}

@keyframes ringPulse {
  0% { transform: scale(.7); opacity: .9; }
  100% { transform: scale(1.5); opacity: 0; }
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 25px;
  margin: 8px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(135deg, #ff1764, #a500ff);
  box-shadow: 0 0 20px rgba(255, 23, 100, .4);
  transition: transform .2s;
}

button:active {
  transform: scale(.95);
}

#letter {
  display: none;
  width: 100%;
  max-width: 650px;
  margin: 20px auto;
  padding: 22px 18px;
  background: rgba(255, 255, 255, .075);
  border: 1px solid rgba(255, 145, 190, .45);
  border-radius: 22px;
  box-shadow: 0 0 28px rgba(255, 36, 110, .15);
  text-align: left;
  line-height: 1.9;
  color: #fff0f6;
  font-size: 16px;
  overflow-wrap: anywhere;
  animation: letterAppear 1.8s ease both;
}

#letter h2 {
  text-align: center;
  color: #ff6da5;
  font-size: 26px;
  margin-bottom: 16px;
  text-shadow: 0 0 15px #ff1764;
}

#letter p {
  white-space: pre-wrap;
}

#letter .ending {
  margin-top: 18px;
  text-align: center;
  color: #ff9cc3;
  font-weight: bold;
  text-shadow: 0 0 12px #ff1764;
}

@keyframes letterAppear {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

.garden {
  position: relative;
  width: 100%;
  min-height: 270px;
  margin-top: 25px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: clamp(5px, 2vw, 20px);
  padding: 15px 0 0;
  overflow: hidden;
  background: linear-gradient(180deg, transparent, rgba(31, 15, 42, .6));
}

.flower {
  position: relative;
  width: clamp(35px, 10vw, 65px);
  height: var(--height, 180px);
  flex: 0 1 65px;
  animation: sway 3s ease-in-out infinite alternate;
  transform-origin: bottom center;
}

.flower:nth-child(even) {
  animation-delay: -.8s;
}

.stem {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 4px;
  height: 76%;
  border-radius: 5px;
  background: linear-gradient(#65e68a, #167b47);
  transform: translateX(-50%);
}

.leaf {
  position: absolute;
  bottom: 30%;
  left: 50%;
  width: 23px;
  height: 11px;
  background: #48c879;
  border-radius: 100% 0 100% 0;
  transform: rotate(-30deg);
}

.leaf.two {
  bottom: 48%;
  transform: translateX(-100%) rotate(30deg) scaleX(-1);
}

.bloom {
  position: absolute;
  left: 50%;
  top: 0;
  width: 48px;
  height: 48px;
  transform: translateX(-50%);
  animation: flowerGlow 2s ease-in-out infinite alternate;
}

.petal {
  position: absolute;
  left: 15px;
  top: 0;
  width: 18px;
  height: 25px;
  border-radius: 50%;
  background: var(--petal, #ff72bd);
  transform-origin: 9px 24px;
  box-shadow: 0 0 10px var(--petal, #ff72bd);
}

.petal:nth-child(1) { transform: rotate(0deg); }
.petal:nth-child(2) { transform: rotate(45deg); }
.petal:nth-child(3) { transform: rotate(90deg); }
.petal:nth-child(4) { transform: rotate(135deg); }
.petal:nth-child(5) { transform: rotate(180deg); }
.petal:nth-child(6) { transform: rotate(225deg); }
.petal:nth-child(7) { transform: rotate(270deg); }
.petal:nth-child(8) { transform: rotate(315deg); }

.center {
  position: absolute;
  left: 19px;
  top: 18px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #ffe58a;
  box-shadow: 0 0 12px #fff0a0;
}

@keyframes sway {
  from { transform: rotate(-7deg); }
  to { transform: rotate(7deg); }
}

@keyframes flowerGlow {
  from { filter: brightness(.85); }
  to { filter: brightness(1.35); }
}

#gardenMessage {
  font-size: clamp(20px, 5vw, 29px);
  font-weight: bold;
  line-height: 1.5;
  padding: 18px 8px 8px;
  color: #ff416f;
  text-shadow: 0 0 8px #ff174d, 0 0 22px #ff174d;
  animation: messageGlow 1.4s infinite alternate;
}

@keyframes messageGlow {
  from { opacity: .7; text-shadow: 0 0 8px #ff174d; }
  to { opacity: 1; text-shadow: 0 0 14px #ff174d, 0 0 30px #ff174d; }
}

.floating {
  position: fixed;
  top: -35px;
  left: 0;
  z-index: 5;
  pointer-events: none;
  animation: fall linear forwards;
  filter: drop-shadow(0 0 7px rgba(255, 100, 180, .8));
}

@keyframes fall {
  from { transform: translateY(-30px) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

#shade {
  position: fixed;
  inset: 0;
  background: #030008;
  opacity: 0;
  z-index: 4;
  pointer-events: none;
  transition: opacity .6s ease;
}

body.celebrating #shade {
  opacity: .58;
}

body.celebrating #scene {
  filter: brightness(.75);
}

#scene > * {
  position: relative;
  z-index: 1;
}

#scene::before {
  z-index: -1;
}

@media (max-width: 420px) {
  #scene {
    padding-left: 12px;
    padding-right: 12px;
  }

  #letter {
    padding: 18px 14px;
    font-size: 15px;
  }

  .garden {
    min-height: 220px;
  }

  #heartArea {
    width: 155px;
    height: 155px;
  }

  .heart {
    font-size: 86px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .heart, .flower, .bloom, #gardenMessage {
    animation-duration: 2s;
  }
}
</style>
</head>

<body>
<div id="shade"></div>

<main id="scene">
  <h1>I'm Sorry Hino ❤️</h1>
  <p class="subtitle">Some feelings are too big for words...</p>

  <div id="heartArea">
    <div class="heart-ring"></div>
    <div class="heart-ring"></div>
    <div class="heart">♥</div>
  </div>

  <p class="subtitle">This little heart is beating for you ❤️</p>

  <button id="sorryButton" onclick="showLetter()">
    Open My Heart ❤️
  </button>

  <article id="letter">
    <h2>SORRY HINODEE ❤️</h2>
    <p id="letterText"></p>
    <p class="ending">I'M REALLY SORRY ❤️🥺</p>
  </article>

  <section class="garden" id="garden" aria-label="A glowing flower garden"></section>

  <p id="gardenMessage">🌹 My little garden will always bloom for you 🌹</p>
</main>

<script>
const message = `I am sorry hino...i did hurtt u a lot..i should havee supportedd you yesterday..but it was never my intention to hurt u baby...i was not talking to anyonee sincee that dayy i textedd u in dc...i havee myy own problemss at home..which i don't likee to discuss...that's whyy i leftt for some time...but couldn't love without u all..i knoww u have many problemss in yourr life..but please don't say that i left you...causee i never did and never will...and i am sorry for yesterday's behavior i should had acted mature..and should have looked after u....i am really sorry for that...i won't do it ever again..pls trust me..i knoww it's difficult to..but please...plss tell me abt bhawani di also i am really unawaree of it..plss give mee a last chancee..i am not acting please i do caree for u a lot baby...love you so much...and if there is smth else i did plss let me know...i won't repeat my mistake..`;

let opened = false;

function showLetter() {
  if (opened) return;
  opened = true;

  document.body.classList.add("celebrating");

  const button = document.getElementById("sorryButton");
  button.style.display = "none";

  // A burst of glowing hearts and flowers
  for (let i = 0; i < 65; i++) {
    setTimeout(() => createFloating(), i * 35);
  }

  // Reveal the letter after the celebration begins
  setTimeout(() => {
    const letter = document.getElementById("letter");
    letter.style.display = "block";

    // Typewriter effect
    const target = document.getElementById("letterText");
    let index = 0;

    function typeNext() {
      if (index < message.length) {
        target.textContent += message.charAt(index);
        index++;
        setTimeout(typeNext, 24);
      }
    }

    typeNext();

    letter.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }, 1800);

  // Fade the dark overlay slowly
  setTimeout(() => {
    document.body.classList.remove("celebrating");
  }, 3500);

  // More gentle floating decorations
  let count = 0;
  const extra = setInterval(() => {
    createFloating();
    count++;
    if (count >= 45) clearInterval(extra);
  }, 240);
}

function createFloating() {
  const el = document.createElement("span");
  el.className = "floating";

  const symbols = ["❤️", "💗", "💕", "🌸", "🌹", "💋", "✨"];
  el.textContent = symbols[Math.floor(Math.random() * symbols.length)];

  el.style.left = Math.random() * 100 + "vw";
  el.style.fontSize = (16 + Math.random() * 22) + "px";
  el.style.animationDuration = (3 + Math.random() * 4) + "s";

  document.body.appendChild(el);

  setTimeout(() => el.remove(), 7500);
}

// Build the entire garden automatically
const garden = document.getElementById("garden");
const colors = [
  "#ff72bd",
  "#ff527f",
  "#c58aff",
  "#ff9eac",
  "#ffda79",
  "#a98bff",
  "#ff85d5"
];

for (let i = 0; i < 11; i++) {
  const flower = document.createElement("div");
  flower.className = "flower";

  const height = 115 + Math.random() * 130;
  const color = colors[i % colors.length];

  flower.style.setProperty("--height", height + "px");
  flower.style.setProperty("--petal", color);

  flower.innerHTML = `
    <div class="stem"></div>
    <div class="leaf"></div>
    <div class="leaf two"></div>
    <div class="bloom">
      ${'<div class="petal"></div>'.repeat(8)}
      <div class="center"></div>
    </div>
  `;

  garden.appendChild(flower);
}

// Gentle ambient decorations from the beginning
setInterval(() => {
  if (Math.random() > .45) createFloating();
}, 1300);
</script>
</body>
</html>
